# ruff·pyright·pytest 를 windows-latest 에서 돌린다. 시험은 모델·Langfuse·OpenRouter 를 부르지 않아 비밀값이 필요 없다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: 진단 - bash·git 위치 (셸 백엔드가 git 위쪽 폴더에서 bin/bash.exe 를 찾는다)
        shell: cmd
        run: where bash & where git & exit /b 0
      - name: 의존성 (extras 를 모두 깔아 langfuse·openrouter 시험도 실제로 돈다)
        run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - name: pyright (src, scripts)
        run: uv run pyright
      - run: uv run pytest -q -p no:cacheprovider
