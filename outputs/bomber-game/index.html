<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>지뢰찾기</h1>

    <div class="toolbar">
      <label for="difficulty">난이도</label>
      <select id="difficulty">
        <option value="easy">쉬움 (9x9, 지뢰 10개)</option>
        <option value="normal">보통 (16x16, 지뢰 40개)</option>
        <option value="hard">어려움 (30x16, 지뢰 99개)</option>
      </select>
    </div>

    <div class="status">
      <div class="counter">남은 지뢰 <span id="mines-left">10</span></div>
      <button type="button" id="new-game">새 게임</button>
      <div class="counter">시간 <span id="timer">0</span>초</div>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
  </main>

  <script src="minesweeper.js"></script>
</body>
</html>
