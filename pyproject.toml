[project]
name = "code-agent"
version = "0.1.0"
description = "Deep Agents SDK 기반 터미널 코딩 에이전트"
readme = "README.md"
authors = [
    { name = "Woong", email = "59645041+WoongDream@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepagents==0.7.32",
    "langgraph-checkpoint-sqlite",
    "prompt-toolkit",
    "python-dotenv>=1.2.3",
    "rich",
]

[project.optional-dependencies]
openrouter = ["langchain-openrouter==0.2.8"]
langfuse = ["langfuse>=5.1,<6"]

[project.scripts]
code-agent = "code_agent.cli:main"

[dependency-groups]
# pyright[nodejs]: Node 가 없는 PC(이 PC)에서도 pyright 를 돌린다
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "pyright[nodejs]>=1.1.400,<1.2"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# pjt 와 같은 기준일로 고정해 같은 버전(langchain 1.4.7, langgraph 1.2.19 등)으로 해석되게 한다.
exclude-newer = "2026-10-31T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]  # buggy_repo 는 일부러 실패하는 시험을 가진다

[tool.ruff]
# PEP8 은 팀이 합의하면 99자까지 허용한다. ruff 는 한글을 폭 2로 세므로 글자 수로는 PEP8 보다 엄격하다
line-length = 99
target-version = "py313"
extend-exclude = ["outputs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D1"]
ignore = ["D105", "D107"]  # 매직 메서드와 __init__ 은 클래스 docstring 으로 설명한다

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]  # 시험 이름이 설명이다

[tool.pyright]
# 1단계: src 와 scripts 만 게이트로 둔다. tests 는 2단계(남은 오류를 고친 뒤 include 에 넣는다)
include = ["src", "scripts"]
exclude = ["tests/fixtures"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]  # src: 설치본이 아닌 이 체크아웃을 본다. tests: 2단계에서 fakes·test_* import 를 푼다
